#
# The whole suite runs without a car, an adapter, or a Bluetooth radio — that
# is the point of the replay transport, and it is what lets someone send a
# vehicle profile as a pull request. Two gates, both of which must stay green:
# the tests, and the privacy sweep that keeps a private garage out of a public
# repository.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]   # the floor in pyproject.toml, and what it is developed on
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # the privacy sweep reads commit messages

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # NOT requirements.txt: it pins the macOS-only pyobjc wheels the BLE
      # transport needs on the owner's machine, which cannot build on Linux.
      # These are the cross-platform runtime deps from pyproject.toml.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "bleak==1.1.1" "pyserial==3.5" "Flask==3.1.2" pytest

      - name: Tests
        run: pytest -q

      - name: Privacy sweep
        run: python scripts/privacy_sweep.py --log 50
