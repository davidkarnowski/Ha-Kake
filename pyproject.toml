[project]
name = "ha-kake"
version = "0.2.0"
description = "Battery-health and vehicle-telemetry dashboard for the 2011-2012 Nissan Leaf (ZE0) over an ELM327 OBD-II adapter"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "LICENSE-DOCS", "NOTICE"]
authors = [{ name = "David D. Karnowski" }]
requires-python = ">=3.10"   # pyobjc 12 needs 3.10+
keywords = ["nissan-leaf", "ev", "obd-ii", "elm327", "can-bus", "battery", "bms", "telemetry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    # No "License ::" trove classifier: PEP 639 supersedes it with the SPDX
    # `license` field above, and setuptools >= 77 rejects having both.
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "bleak==1.1.1",
    "pyserial==3.5",
    "Flask==3.1.2",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
